    <text x="130" y="310" text-anchor="middle" fill="#94949E" font-family="sans-serif" font-size="10">Top 3–5 cm · forward fringe</text>
  </g>

  <!-- Side view -->
  <g>
    <ellipse cx="320" cy="185" rx="62" ry="78" fill="#121214" stroke="#3FB6E0" stroke-width="2"/>
    <path d="M264 168 Q268 96 320 92 Q372 96 376 168 Q356 140 322 138 Q282 140 264 168Z" fill="#FF2D95" fill-opacity="0.85"/>
    <path d="M268 205 Q320 232 372 205" stroke="#007BA7" stroke-width="4" fill="none" stroke-linecap="round"/>
