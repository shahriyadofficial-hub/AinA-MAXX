    <text x="320" y="310" text-anchor="middle" fill="#94949E" font-family="sans-serif" font-size="10">Low fade · guard 0 → 2 blend</text>
  </g>

  <!-- Back view -->
  <g>
    <ellipse cx="510" cy="185" rx="62" ry="78" fill="#121214" stroke="#3FB6E0" stroke-width="2"/>
