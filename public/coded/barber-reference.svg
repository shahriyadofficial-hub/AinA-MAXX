<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Barber reference: textured crop with low skin fade — front, side and back views">
  <rect width="640" height="360" rx="24" fill="#0A0A0A"/>
  <rect x="12" y="12" width="616" height="336" rx="18" fill="#1A1A1D" stroke="#007BA7" stroke-opacity="0.45"/>
  <text x="320" y="42" text-anchor="middle" fill="#FFFFFF" font-family="Space Grotesk, sans-serif" font-size="17" font-weight="700">BARBER REFERENCE — TEXTURED CROP · LOW SKIN FADE</text>
  <text x="320" y="62" text-anchor="middle" fill="#3FB6E0" font-family="sans-serif" font-size="11">Front · Side · Back — keep the hairline natural</text>

  <!-- Front view -->
  <g>
    <ellipse cx="130" cy="185" rx="62" ry="78" fill="#121214" stroke="#3FB6E0" stroke-width="2"/>
    <path d="M74 168 Q78 96 130 92 Q182 96 186 168 Q168 128 130 126 Q92 128 74 168Z" fill="#FF2D95" fill-opacity="0.85"/>
    <path d="M92 138 Q130 118 168 138" stroke="#0A0A0A" stroke-width="5" fill="none" stroke-linecap="round"/>
