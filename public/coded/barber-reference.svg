    <text x="510" y="310" text-anchor="middle" fill="#94949E" font-family="sans-serif" font-size="10">Clean taper · no hard line</text>
  </g>

  <text x="320" y="336" text-anchor="middle" fill="#94949E" font-family="sans-serif" font-size="10">Ai∩A MAXX · muse-image reference · Haircut guide only — no face scoring</text>
